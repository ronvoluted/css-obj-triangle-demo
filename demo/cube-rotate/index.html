<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Cube – Pure CSS Rotation</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="demo.js"></script>
  </head>
  <body>
    <main class="demo">
      <h1 class="title">CSS-only cube rotation</h1>
      <p class="subtitle">
        Triangles are built once by JS, then a single <code>@keyframes</code>
        rule on <code>.mesh</code> handles the infinite spin.
      </p>

      <div class="scene">
        <div class="mesh" id="mesh"></div>
      </div>
    </main>
  </body>
</html>
