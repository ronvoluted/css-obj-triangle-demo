<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 3D – cube-test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="demo">
      <h1 class="title">CSS 3D &ndash; cube-test</h1>
      <p class="subtitle">
        Every triangle is a static <code>&lt;div&gt;</code> with a baked
        <code>matrix3d()</code> transform. Zero runtime JS &mdash; pure HTML + CSS.
      </p>

      <div class="scene">
        <div class="mesh">
        <div class="triangle" style="transform:matrix3d(0,250,250,0,0,0,250,0,1,0,0,0,125,-125,-125,1);background:linear-gradient(to bottom right, hsl(210, 72%, 38.338059%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(0,250,0,0,0,250,250,0,1,0,0,0,125,-125,-125,1);background:linear-gradient(to bottom right, hsl(247, 72%, 38.338059%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(0,-250,250,0,0,0,250,0,-1,0,0,0,-125,125,-125,1);background:linear-gradient(to bottom right, hsl(284, 72%, 35.48%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(0,-250,0,0,0,-250,250,0,-1,0,0,0,-125,125,-125,1);background:linear-gradient(to bottom right, hsl(321, 72%, 35.48%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,0,-250,0,0,0,-250,0,0,-1,0,0,125,-125,125,1);background:linear-gradient(to bottom right, hsl(358, 72%, 41.291791%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,0,0,0,-250,0,-250,0,0,-1,0,0,125,-125,125,1);background:linear-gradient(to bottom right, hsl(35, 72%, 41.291791%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,0,250,0,0,0,250,0,0,1,0,0,125,125,-125,1);background:linear-gradient(to bottom right, hsl(72, 72%, 35.48%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,0,0,0,-250,0,250,0,0,1,0,0,125,125,-125,1);background:linear-gradient(to bottom right, hsl(109, 72%, 35.48%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,-250,0,0,0,-250,0,0,0,0,1,0,125,125,125,1);background:linear-gradient(to bottom right, hsl(146, 72%, 57.537313%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,0,0,0,-250,-250,0,0,0,0,1,0,125,125,125,1);background:linear-gradient(to bottom right, hsl(183, 72%, 57.537313%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,250,0,0,0,250,0,0,0,0,-1,0,125,-125,-125,1);background:linear-gradient(to bottom right, hsl(220, 72%, 35.48%) 50%, transparent 50%);backface-visibility:hidden"></div>
        <div class="triangle" style="transform:matrix3d(-250,0,0,0,-250,250,0,0,0,0,-1,0,125,-125,-125,1);background:linear-gradient(to bottom right, hsl(257, 72%, 35.48%) 50%, transparent 50%);backface-visibility:hidden"></div>
        </div>
      </div>
    </main>
  </body>
</html>
